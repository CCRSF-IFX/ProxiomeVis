name: R unit tests

on:
  push:
    paths:
      - "DESCRIPTION"
      - "app.R"
      - "R/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci_r.yaml"
  pull_request:
    paths:
      - "DESCRIPTION"
      - "app.R"
      - "R/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci_r.yaml"

permissions:
  contents: read

concurrency:
  group: r-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      ARROW_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install test and runtime packages
        run: >-
          Rscript --vanilla -e
          'install.packages(c("testthat", "shiny", "bslib", "ggplot2", "plotly", "threejs",
          "DT", "SeuratObject", "Matrix", "jsonlite", "data.table", "ggrepel",
          "scales", "tibble", "pheatmap", "yaml", "withr", "htmltools",
          "callr", "promises", "later", "digest", "arrow", "dplyr", "DBI", "duckdb"),
          repos = c(CRAN = Sys.getenv("RSPM", "https://cloud.r-project.org")))'

      - name: Run unit tests
        run: Rscript --vanilla tests/testthat.R
