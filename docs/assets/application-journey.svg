<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1333.3 750" width="1333.3" height="750" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="jt jd">
<title id="jt">Using ProxiomeVis</title><desc id="jd">App journey: data preparation and startup, explore and analyze, then two analysis paths that converge on linked views and exports.</desc>
<defs><marker id="jS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52607A"/></marker><marker id="jSb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#52607A"/></marker><marker id="jT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14213D"/></marker><marker id="jTb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14213D"/></marker></defs>
<rect width="1333.3" height="750" fill="#FFFFFF"/>
<text x="50" y="59.3" font-size="38" font-weight="700" font-family="Cambria, Caladea, Georgia, serif" fill="#14213D">Using ProxiomeVis</text>
<text x="50" y="85.6" font-size="16" fill="#52607A">Stage 5 of the analysis workflow, from a prepared bundle to linked views and exploratory tests</text>
<text x="50" y="119.2" font-size="12" font-weight="700" letter-spacing="1.2" fill="#52607A">DATA PREPARATION AND STARTUP</text>
<text x="50" y="254.2" font-size="12" font-weight="700" letter-spacing="1.2" fill="#52607A">EXPLORE AND ANALYZE</text>
<text x="50" y="432.2" font-size="12" font-weight="700" letter-spacing="1.2" fill="#52607A">TWO ANALYSIS PATHS</text>
<text x="300" y="432.2" font-size="12" fill="#52607A">Dashed outline: exploratory, kept for the session only</text>
<rect x="50" y="130" width="285" height="92" rx="8" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
<circle cx="87" cy="161" r="15" fill="#E3ECF5"/>
<text x="87" y="166.3" font-size="15" text-anchor="middle" font-weight="700" fill="#52607A">1</text>
<text x="112" y="166.6" font-size="16" font-weight="700" fill="#14213D">Prepare source analysis</text>
<text font-size="12.5" fill="#52607A"><tspan x="70" y="187.6">Annotated Seurat RDS with abundance,</tspan><tspan x="70" y="203.6">proximity and colocalization results</tspan></text>
<path d="M335,176 L365,176" stroke="#52607A" stroke-width="2" marker-end="url(#jS)"/>
<rect x="366" y="130" width="285" height="92" rx="8" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
<circle cx="403" cy="161" r="15" fill="#E3ECF5"/>
<text x="403" y="166.3" font-size="15" text-anchor="middle" font-weight="700" fill="#52607A">2</text>
<text x="428" y="166.6" font-size="16" font-weight="700" fill="#14213D">Build app bundle</text>
<text font-size="12.5" fill="#52607A"><tspan x="386" y="187.6">Scripts write a versioned analysis.rds</tspan><tspan x="386" y="203.6">plus proximity and graph sidecars</tspan></text>
<path d="M651,176 L681,176" stroke="#52607A" stroke-width="2" marker-end="url(#jS)"/>
<rect x="682" y="130" width="285" height="92" rx="8" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
<circle cx="719" cy="161" r="15" fill="#E3ECF5"/>
<text x="719" y="166.3" font-size="15" text-anchor="middle" font-weight="700" fill="#52607A">3</text>
<text x="744" y="166.6" font-size="16" font-weight="700" fill="#14213D">Load approved data</text>
<text font-size="12.5" fill="#52607A"><tspan x="702" y="187.6">Keep bundle and sidecars together and</tspan><tspan x="702" y="203.6">point the app at the approved RDS path</tspan></text>
<path d="M967,176 L997,176" stroke="#52607A" stroke-width="2" marker-end="url(#jS)"/>
<rect x="998" y="130" width="285" height="92" rx="8" fill="#EEF2F8" stroke="#14213D" stroke-width="1.5"/>
<circle cx="1035" cy="161" r="15" fill="#14213D"/>
<text x="1035" y="166.3" font-size="15" text-anchor="middle" font-weight="700" fill="#FFFFFF">4</text>
<text x="1060" y="166.6" font-size="16" font-weight="700" fill="#14213D">Start app</text>
<text font-size="12.5" fill="#52607A"><tspan x="1018" y="187.6">Run locally or deploy; confirm the active</tspan><tspan x="1018" y="203.6">bundle in the Dataset panel</tspan></text>
<path d="M1140.5,222 L1140.5,246 L375,246 L375,269" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#jT)"/>
<rect x="50" y="270" width="385" height="140" rx="8" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
<rect x="70" y="284" width="81" height="20" rx="10" fill="#E3ECF5"/><text x="110.5" y="297.9" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="1.2" fill="#52607A">ORIENT</text>
<text x="70" y="330.6" font-size="19" font-weight="700" fill="#14213D">Overview / QC</text>
<text font-size="12.5" fill="#52607A"><tspan x="70" y="352.6">Cell and sample metrics, QC counts per step and</tspan><tspan x="70" y="368.6">analysis provenance for the active bundle</tspan></text>
<path d="M435,340 L473,340" stroke="#14213D" stroke-width="2" marker-end="url(#jT)"/>
<rect x="474" y="270" width="385" height="140" rx="8" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.5"/>
<rect x="494" y="284" width="89.5" height="20" rx="10" fill="#E3ECF5"/><text x="538.8" y="297.9" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="1.2" fill="#52607A">EXPLORE</text>
<text x="494" y="330.6" font-size="19" font-weight="700" fill="#14213D">Embeddings</text>
<text font-size="12.5" fill="#52607A"><tspan x="494" y="352.6">Choose embedding, coloring and donor or sample</tspan><tspan x="494" y="368.6">split; inspect cells and export the view as SVG</tspan></text>
<path d="M859,340 L897,340" stroke="#14213D" stroke-width="2" marker-end="url(#jT)"/>
<rect x="898" y="270" width="385" height="140" rx="8" fill="#EEF2F8" stroke="#14213D" stroke-width="1.5"/>
<rect x="918" y="284" width="81" height="20" rx="10" fill="#FFFFFF"/><text x="958.5" y="297.9" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="1.2" fill="#14213D">CHOOSE</text>
<text x="918" y="330.6" font-size="19" font-weight="700" fill="#14213D">Results or New comparison?</text>
<text font-size="12.5" fill="#52607A"><tspan x="918" y="352.6">Results shows prepared analyses and completed</tspan><tspan x="918" y="368.6">session comparisons. New comparison submits an</tspan><tspan x="918" y="384.6">exploratory test for one donor and two conditions.</tspan></text>
<path d="M1090.5,410 L1090.5,440 L350,440" fill="none" stroke="#52607A" stroke-width="2"/>
<path d="M350,440 L350,453" stroke="#52607A" stroke-width="2" marker-end="url(#jS)"/>
<path d="M983,440 L983,453" stroke="#52607A" stroke-width="2" marker-end="url(#jS)"/>
<rect x="50" y="454" width="600" height="170" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="78" y="470" width="123.5" height="20" rx="10" fill="#E3ECF5"/><text x="139.8" y="483.9" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="1.2" fill="#14213D">PRECOMPUTED</text>
<text x="78" y="519.0" font-size="20" font-weight="700" fill="#14213D">Inspect Results</text>
<text font-size="13" fill="#0F172A"><tspan x="78" y="545.0" font-weight="700">Tables</tspan><tspan> — results, sample support, methods and CSV downloads</tspan></text>
<text font-size="13" fill="#0F172A"><tspan x="78" y="573.0" font-weight="700">Volcano</tspan><tspan> — click a point to change the cell distribution beside it</tspan></text>
<text font-size="13" fill="#0F172A"><tspan x="78" y="601.0" font-weight="700">Spatial patterns</tspan><tspan> — aligned matrices, shared protein order, network view</tspan></text>
<path d="M350,624 L350,645" stroke="#52607A" stroke-width="2" marker-end="url(#jS)"/>
<rect x="683" y="454" width="600" height="170" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="711" y="470" width="123.5" height="20" rx="10" fill="#E3ECF5"/><text x="772.8" y="483.9" font-size="11" text-anchor="middle" font-weight="700" letter-spacing="1.2" fill="#14213D">CUSTOM TEST</text>
<text x="711" y="519.0" font-size="20" font-weight="700" fill="#14213D">Run New comparison</text>
<text font-size="13" fill="#0F172A"><tspan x="711" y="545.0" font-weight="700">Scope</tspan><tspan> — one donor, one cell type, two conditions, one readout</tspan></text>
<text font-size="13" fill="#0F172A"><tspan x="711" y="573.0" font-weight="700">Run</tspan><tspan> — readiness check and exploratory notice, then an isolated R worker</tspan></text>
<text font-size="13" fill="#0F172A"><tspan x="711" y="601.0" font-weight="700">Keep</tspan><tspan> — session history, Open in Results, download CSV, JSON or RDS</tspan></text>
<path d="M983,624 L983,645" stroke="#52607A" stroke-width="2" marker-end="url(#jS)"/>
<rect x="50" y="646" width="1233.3" height="48" rx="24" fill="#14213D"/>
<text x="666.6" y="674.9" font-size="14" text-anchor="middle" fill="#FFFFFF">Selected feature links every view   •   Cell 3D shows a ranked cell as a node graph   •   Exports carry config, versions and checksums</text>
<text x="50" y="720.2" font-size="12" fill="#52607A">ProxiomeVis  |  app journey</text>
</svg>