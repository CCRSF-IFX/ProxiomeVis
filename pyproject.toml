[project]
name = "proxiomevis"
version = "0.1.0"
description = "Python Shiny explorer for processed Pixelgen AnnData"
requires-python = ">=3.10,<3.12"
dependencies = [
  "anndata",
  "kaleido",
  "numpy",
  "pandas",
  "plotly",
  "scipy",
  "shiny",
  "shinywidgets",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_python"]
